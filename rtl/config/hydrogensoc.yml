name: hydrogensoc

import:
  - riscv_atom

params:
  # Use rv32imc_zicsr
  ext_muldiv: true
  ext_compressed: true
  ext_csr: true
  en_exceptions: true   # interrupt/exception support
  clk_freq: 50000000    # Hz (platform table, SDC); boards override it in <soc>-<board>.yml

  # Memory map and peripherals: the only source. Each <x>.<key> becomes SOC_<X>_<KEY> in the
  # generated config headers (RTL, C, asm, atomsim, linker scripts); 'enable: true' becomes
  # SOC_EN_<X>, and a disabled peripheral emits nothing.
  peripherals:
    bootrom:
      addr: 0x00010000
      size: 8KB

    ram:
      addr: 0x20000000
      size: 48KB

    uart:
      enable: true
      addr: 0x40000000
      size: 16
      fifo_en: true
      fifo_depth: 4

    gpio:
      enable: true
      addr: 0x40002000
      size: 16
      num_pins: 16

    spi:
      enable: true
      addr: 0x40003000
      size: 32
      num_cs: 1

    timer:
      enable: true
      addr: 0x40004000
      size: 16

design:
  topmodule: HydrogenSoC

  # Common defines (RTL, libcatom, bootloader, examples and atomsim)
  defines: []
  
  # Verilog-only defines
  vdefines:
    - SOC_RESET_ADDR=$[peripherals.bootrom.addr]

  # C-only defines (target selection in libcatom / bootloader)
  cdefines:
    - TARGET_HYDROGENSOC

  sources:
    # SoC Top
    hydrogensoc:
      vsrcs:
        - $[env.RVATOM]/rtl/soc/hydrogensoc/HydrogenSoC.v

    # Wishbone Memory
    mem:
      vsrcs:
        - $[env.RVATOM]/rtl/uncore/mem/DualPortRAM_wb.v
        - $[env.RVATOM]/rtl/uncore/mem/SinglePortROM_wb.v
        - $[env.RVATOM]/rtl/uncore/mem/SinglePortRAM_wb.v
   
    # Wishbone UART
    uart:
      vsrcs:
        - $[env.RVATOM]/rtl/uncore/uart/UART.v
        - $[env.RVATOM]/rtl/uncore/uart/UART_core.v
        - $[env.RVATOM]/rtl/lib/FIFO_sync.v

    # Wishbone GPIO
    gpio:
      vsrcs:
        - $[env.RVATOM]/rtl/uncore/gpio/GPIO.v

    # Wishbone SPI
    spi:
      vsrcs:
        - $[env.RVATOM]/rtl/uncore/spi/SPI_wb.v
        - $[env.RVATOM]/rtl/uncore/spi/SPI_core.v

    # Wishbone Timer
    timer:
      vsrcs:
        - $[env.RVATOM]/rtl/uncore/timer/Timer_wb.v

    # Wishbone bus components
    wishbone:
      vsrcs:
        - $[env.RVATOM]/rtl/lib/Arbiter.v
        - $[env.RVATOM]/rtl/uncore/wishbone/Arbiter2_wb.v
        - $[env.RVATOM]/rtl/uncore/wishbone/Crossbar_wb.v
        - $[env.RVATOM]/rtl/lib/Priority_encoder.v

